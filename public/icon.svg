<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A51E46" />
      <stop offset="100%" stop-color="#670C26" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E08B" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#997715" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- Central Lotus / Diya / Sweets Symbol -->
  <g transform="translate(256, 240) scale(1.1)">
    <!-- Outer petals -->
    <path d="M0,70 C-50,60 -90,20 -100,-25 C-65,-20 -35,5 0,35 C35,5 65,-20 100,-25 C90,20 50,60 0,70 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M0,70 C-40,40 -70,-5 -70,-55 C-45,-45 -20,-10 0,25 C20,-10 45,-45 70,-55 C70,-5 40,40 0,70 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Central lotus petal / flame flame of diya -->
    <path d="M0,70 C-25,35 -40,-25 0,-85 C40,-25 25,35 0,70 Z" fill="#FFF2BD"/>
    <!-- Diya Base / Sweet Bowl (Katori) -->
    <path d="M-80,60 C-60,110 60,110 80,60 C50,75 -50,75 -80,60 Z" fill="url(#goldGrad)"/>
    <!-- Little sweet dots (motichoor pearls) -->
    <circle cx="0" cy="-15" r="7" fill="#8A1538" />
    <circle cx="-22" cy="0" r="5" fill="#8A1538" />
    <circle cx="22" cy="0" r="5" fill="#8A1538" />
  </g>
  <!-- Wordmark arc / base text -->
  <text x="256" y="420" font-family="'Fraunces', serif" font-size="34" font-weight="700" fill="#FFF4D0" text-anchor="middle" letter-spacing="4">SARASWATI</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">SWEETS • BARABANKI</text>
</svg>
